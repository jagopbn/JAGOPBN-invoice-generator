<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JAGOPBN Invoice Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <style>
    .invoice-container {
      width: 794px;
      min-height: 400px;
      padding: 40px;
      background: white;
      color: #0d47a1;
      font-family: Arial, sans-serif;
      position: relative;
      border-radius: 10px;
      margin: auto;
      border: 2px solid #0d47a1;
    }
    .watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 6rem;
      color: rgba(13, 71, 161, 0.05);
      font-weight: bold;
      pointer-events: none;
      z-index: 0;
      white-space: nowrap;
      user-select: none;
    }
    .invoice-header h1 {
      font-size: 2.5rem;
      font-weight: bold;
    }
    .invoice-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 2rem;
      z-index: 1;
    }
    .invoice-table th {
      background-color: #0d47a1;
      color: white;
      font-weight: bold;
      padding: 12px;
      border: 1px solid #0d47a1;
    }
    .invoice-table td {
      background-color: #e3f2fd;
      padding: 10px;
      border: 1px solid #0d47a1;
    }
    .invoice-total {
      font-size: 1.75rem;
      font-weight: bold;
      text-align: right;
      margin-top: 2rem;
    }
    .invoice-footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      text-align: center;
      opacity: 0.8;
    }
    input, textarea {
      color: black;
    }
  </style>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-lg mb-6">
    <h1 class="text-2xl font-bold text-blue-700 mb-4 text-center">JAGOPBN Invoice Generator</h1>
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="font-semibold">Nama Client</label>
        <input type="text" id="clientName" class="w-full p-2 border rounded" />
      </div>
      <div>
        <label class="font-semibold">Diskon (opsional)</label>
        <input type="number" id="discount" class="w-full p-2 border rounded" placeholder="Contoh: 5000"/>
      </div>
      <div>
        <label class="font-semibold">Nomor Rekening</label>
        <input type="text" id="accountNumber" class="w-full p-2 border rounded" />
      </div>
      <div>
        <label class="font-semibold">Nama Pemilik Rekening</label>
        <input type="text" id="accountName" class="w-full p-2 border rounded" />
      </div>
      <div>
        <label class="font-semibold">Bank</label>
        <input type="text" id="bank" class="w-full p-2 border rounded" />
      </div>
    </div>
    <div>
      <h2 class="text-lg font-semibold mb-2">Item & Harga</h2>
      <div id="items"></div>
      <button onclick="addItem()" class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">+ Tambah Item</button>
    </div>
    <div class="mt-4 flex justify-between">
      <button onclick="generateInvoice()" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">Generate Invoice</button>
      <button onclick="downloadInvoice()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Download Invoice</button>
    </div>
  </div>

  <div id="output" class="mb-10"></div>

  <script>
    function addItem() {
      const container = document.getElementById('items');
      const index = container.children.length + 1;
      const html = `
        <div class="grid grid-cols-2 gap-2 mb-2">
          <input type="text" placeholder="Item ${index}" class="p-2 border rounded item-name" />
          <input type="number" placeholder="Harga" class="p-2 border rounded item-price" />
        </div>
      `;
      container.insertAdjacentHTML('beforeend', html);
    }

    function generateInvoice() {
      const clientName = document.getElementById('clientName').value;
      const discount = parseInt(document.getElementById('discount').value || 0);
      const accountNumber = document.getElementById('accountNumber').value;
      const accountName = document.getElementById('accountName').value;
      const bank = document.getElementById('bank').value;
      const today = new Date();
      const dateStr = today.toLocaleDateString('id-ID');
      const invoiceNumber = Math.floor(100000 + Math.random() * 900000);

      const itemNames = document.querySelectorAll('.item-name');
      const itemPrices = document.querySelectorAll('.item-price');

      let total = 0;
      let rows = '';

      itemNames.forEach((input, i) => {
        const name = input.value;
        const price = parseInt(itemPrices[i].value || 0);
        total += price;
        rows += `<tr><td>${name}</td><td class='text-right'>Rp ${price.toLocaleString()}</td></tr>`;
      });

      total -= discount;

      const invoiceHTML = `
        <div id="invoice" class="invoice-container">
          <div class="watermark">JAGOPBN</div>
          <div class="invoice-header z-10 relative">
            <h1>INVOICE</h1>
            <p><strong>TOKO:</strong> JAGOPBN</p>
            <p>Invoice #:<strong> ${invoiceNumber} </strong></p>
            <p>Tanggal: ${dateStr}</p>
            <p>Client: ${clientName}</p>
          </div>
          <table class="invoice-table z-10 relative">
            <thead>
              <tr>
                <th>Item</th>
                <th>Harga</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
          <div class="invoice-total z-10 relative">
            Total: Rp ${total.toLocaleString()}
          </div>
          <div class="z-10 relative mt-6 text-sm text-center">
            <p><strong>Payment Info:</strong><br> <strong>${accountNumber} </strong>a/n ${accountName} (${bank})</p>
          </div>
          <div class="invoice-footer z-10 relative">
            Terima Kasih Telah Mempercayai Kami.
          </div>
        </div>
      `;

      document.getElementById('output').innerHTML = invoiceHTML;
    }

    function downloadInvoice() {
      const invoice = document.getElementById('invoice');
      if (!invoice) return alert("Silakan generate invoice terlebih dahulu.");

      html2canvas(invoice, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `invoice_${Date.now()}.jpg`;
        link.href = canvas.toDataURL("image/jpeg", 1.0);
        link.click();
      });
    }

    window.onload = () => addItem();
  </script>
</body>
</html>
